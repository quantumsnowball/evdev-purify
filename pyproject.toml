[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[project]
name = "evdev-purify"
version = "0.3.0"
description = "A tool to purify the event flow for any evdev device"
authors = [
    { name = "Quantum Snowball", email = "quantum.snowball@gmail.com" }
]
dependencies = [
    "typer",
    "evdev",
]
requires-python = ">=3.14.4"

[project.urls]
Homepage = "https://github.com/quantumsnowball/evdev-purify"

[project.scripts]
evdev-purify = "evdev_purify:app"

[tool.pyright]
venvPath = "./"
venv = ".venv"

[tool.ruff.lint]
# Q = flake8-quotes (surgical string fixing)
# I = isort (import sorting)
# F401 = unused imports
select = ["Q", "I", "F401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
